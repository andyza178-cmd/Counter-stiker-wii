
name: Comprobar compilador Wii

on:
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Comprobar herramientas
        run: |
          echo "Comprobando compilador..."
          echo "$DEVKITPPC/bin" >> "$GITHUB_PATH"
          export PATH="$DEVKITPPC/bin:$PATH"
          powerpc-eabi-gcc --version
          echo "Compilador disponible"
          
        
