
name: Construir Counter Strike Wii

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar herramientas
        run: |
          echo "$DEVKITPPC/bin" >> "$GITHUB_PATH"
          export PATH="$DEVKITPPC/bin:$PATH"

            - name: Instalar dependencias
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm \
            libogc \
            libfat-ogc \
            ppc-libpng \
            ppc-freetype \
            ppc-libjpeg-turbo

      - name: Descargar GRRLIB
        run: |
          git clone --depth 1 \
            https://github.com/GRRLIB/GRRLIB.git \
            /tmp/GRRLIB

      - name: Revisar GRRLIB
        run: |
          ls -la /tmp/GRRLIB
          find /tmp/GRRLIB -maxdepth 2 -name Makefile

      - name: Compilar juego
        run: |
          export PATH="$DEVKITPPC/bin:$PATH"
          make

      - name: Guardar archivo DOL
        uses: actions/upload-artifact@v4
        with:
          name: counter-strike-wii
          path: counter_strike_wii.dol
          if-no-files-found: error
          
